<div class="space-y-4">
  <div class="flex items-center gap-2">
    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest px-1">
      {{ titulo() }}
    </label>
    <div class="h-[1px] flex-1 bg-slate-100"></div>
  </div>

  <div class="flex gap-2">
    <mat-form-field appearance="outline" class="flex-1 !pb-0">
      <mat-label>{{ placeholder() }}</mat-label>
      <input matInput [formControl]="control" (keyup.enter)="agregar()" placeholder="Escriba aquí..." />
      <mat-icon matPrefix [class]="colorIcono()" class="mr-2">{{ icono() }}</mat-icon>
    </mat-form-field>

    <button type="button" mat-flat-button [color]="colorBoton()" (click)="agregar()"
      class="!h-[56px] !rounded-2xl shadow-sm">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="grid grid-cols-1 gap-2">
    @for (item of lista(); track $index) {
    <div class="flex items-center justify-between p-3 rounded-2xl border animate-in slide-in-from-top-2 duration-200"
      [class]="claseItem()">

      <div class="flex items-center gap-3">
        <div class="w-1.5 h-1.5 rounded-full" [class]="colorIcono().replace('text-', 'bg-')"></div>
        <span class="text-sm text-slate-700 font-medium">{{ item }}</span>
      </div>

      <button type="button" (click)="eliminar($index)"
        class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-100 hover:text-red-600 transition-all">
        <mat-icon class="!text-[18px]">delete_outline</mat-icon>
      </button>
    </div>
    } @empty {
    <div class="py-4 text-center border-2 border-dashed border-slate-50 rounded-2xl">
      <p class="text-[10px] text-slate-300 uppercase font-bold tracking-widest">Lista vacía</p>
    </div>
    }
  </div>
</div>

<!-- GRID PRINCIPAL:
     - h-auto en móvil para permitir scroll general.
     - h-[calc(100vh-160px)] en LG para fijar la vista al tamaño de pantalla.
-->
<div class="grid grid-cols-1 lg:grid-cols-[minmax(300px,65%)_1fr] h-auto lg:h-[calc(100vh-160px)] gap-10 lg:gap-8">

  <!-- ==========================================
       COLUMNA IZQUIERDA: Buscador + Lista
       ========================================== -->
  <!-- En móvil le damos 80vh para que la lista tenga su propio scroll y no sea infinita -->
  <div class="flex flex-col gap-6 h-[80vh] lg:h-full min-h-0">

    <!-- SECCIÓN BUSCADOR (Fija) -->
    <div class="flex-none">
      <div class="grid grid-cols-12 items-center gap-4 mb-2 lg:mb-10">
        <div class="col-span-12 md:col-span-3">
          <h2 class="text-2xl font-black text-slate-800 tracking-tight text-center md:text-left uppercase">
            Gestión del personal
          </h2>
        </div>

        <div class="col-span-9 md:col-span-7">
          <app-search-generico
            placeholder="Buscar trabajador..."
            (onSearch)="filtrarTrabajadores($event)">
          </app-search-generico>
        </div>

        <div class="col-span-3 md:col-span-2 flex justify-center">
          <button (click)="abrirFormulario()"
            class="flex-none w-14 h-14 bg-blue-600 rounded-[1.5rem] flex items-center justify-center text-white shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition-all active:scale-95 group">
            <mat-icon class="!flex !items-center !justify-center !text-[28px] !h-full !w-full font-black">
              person_add
            </mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- SECCIÓN LISTA (Con Scroll Interno) -->
    <div class="flex-1 min-h-0 overflow-y-auto rounded-[2rem] border border-slate-100 bg-white shadow-sm">
      <app-lista-generica
        class="h-full block"
        [data]="trabajadores()"
        [columnas]="columnasTrabajador"
        (filaSeleccionada)="seleccionarTrabajador($event)"
        (onEdit)="abrirFormulario($event)">

        <ng-template #celdaPersonalizada let-item let-col="columna">
          @if (col.key === 'idCargo') {
            <span class="inline-flex items-center px-4 py-1.5 rounded-full text-white bg-blue-600/70 text-xs font-medium">
              {{ item[col.key] }}
            </span>
          } @else if (col.key === 'cedula') {
            <span class="font-black text-sm text-slate-700">
              {{ item[col.key] }}
            </span>
          } @else {
            <span class="font-medium text-sm text-slate-500">
              {{ item[col.key] }}
            </span>
          }
        </ng-template>
      </app-lista-generica>
    </div>
  </div>

  <!-- ==========================================
       COLUMNA DERECHA: Detalle + Tarjetas
       ========================================== -->
  <!-- En móvil h-auto para que se apile naturalmente debajo del 80vh de la lista -->
  <div class="flex flex-col gap-6 h-auto lg:h-full min-h-0">

    <!-- Detalle del Trabajador (70% de prioridad en LG) -->
    <div class="flex-none lg:flex-[7] min-h-0">
      <app-trabajador-detalle
        class="h-full w-full block"
        [trabajadorDetallado]="trabajadorSeleccionado()">
      </app-trabajador-detalle>
    </div>

    <!-- Tarjetas Informativas (30% de prioridad en LG) -->
    <!-- <div class="flex-none lg:flex-[3] min-h-0">
      <app-trabajador-tarjetas
        class="h-full w-full block">
      </app-trabajador-tarjetas>
    </div> -->
  </div>

</div>

<!-- Spinner Global de WorkScan -->
@if (isLoading()) {
  <app-spinner-generico></app-spinner-generico>
}

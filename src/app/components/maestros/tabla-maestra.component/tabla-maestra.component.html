<mat-card class="overflow-hidden shadow-2xl bg-white rounded-[2rem] border border-slate-100 transition-all duration-300">

  <div class="bg-gradient-to-r from-slate-800 to-slate-900 p-4 flex justify-between items-center shadow-inner">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-white/10 rounded-xl backdrop-blur-md">
        <mat-icon class="text-white scale-90">list_alt</mat-icon>
      </div>
      <h2 class="text-lg font-black text-white tracking-tight uppercase">
        {{ titulo() }}
      </h2>
    </div>

    <button mat-mini-fab
      class="!bg-cyan-500 !text-white hover:scale-110 transition-transform shadow-lg shadow-cyan-500/30"
      (click)="onAdd.emit()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <div class="overflow-x-auto custom-scroll">
    <table mat-table [dataSource]="datos()" class="w-full">

      @for (col of columnas(); track (col.key || col)) {
      <ng-container [matColumnDef]="col.key || col">
        <th mat-header-cell *matHeaderCellDef [style.width]="col.width"
            class="!bg-slate-50 !py-4 !text-[10px] !font-black !text-slate-400 !uppercase !tracking-widest !border-b !border-slate-100">
          {{ formatHeader(col) }}
        </th>

        <td mat-cell *matCellDef="let element" class="!py-4">
          @if (plantillaCelda) {
            <ng-container *ngTemplateOutlet="plantillaCelda; context: { $implicit: element, columna: col }">
            </ng-container>
          } @else {
            <span class="text-sm text-slate-600 font-medium">{{ element[col] }}</span>
          }
        </td>
      </ng-container>
      }

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="!bg-slate-50 !text-[10px] !font-black !text-slate-400 !uppercase !tracking-widest !border-b !border-slate-100 w-20 text-center">Acciones</th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <button mat-icon-button class="text-slate-400 hover:text-blue-600 transition-colors" (click)="$event.stopPropagation(); onEdit.emit(element)">
            <mat-icon class="scale-90">edit_note</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="onEdit.emit(row)"
        class="group hover:bg-blue-50/50 cursor-pointer transition-colors duration-200 border-b border-slate-50 last:border-0">
      </tr>
    </table>

    @if (datos().length === 0) {
      <div class="flex flex-col items-center justify-center p-12 space-y-3">
        <mat-icon class="text-slate-200 !w-12 !h-12 text-5xl">inventory_2</mat-icon>
        <p class="text-sm font-bold text-slate-300 uppercase tracking-widest">No hay datos registrados</p>
      </div>
    }
  </div>
</mat-card>

<div class="w-full bg-white rounded-[2.5rem] shadow-sm border border-slate-50 overflow-hidden">

  <div class="overflow-x-auto scrollbar-hide">

    <table class="w-full min-w-[700px] text-left border-separate border-spacing-0">

      <thead>
        <tr class="bg-slate-50/50">
          @for (col of columnas(); track col.key) {
            <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b border-slate-100">
              {{ col.label }}
            </th>
          }
        </tr>
      </thead>

      <tbody class="divide-y divide-slate-50">
        @for (item of data(); track item.cedula) {
          <tr (click)="seleccionar(item)"
              class="group cursor-pointer hover:bg-blue-50/30 transition-all duration-300">

            @for (col of columnas(); track col.key) {
              <td class="px-8 py-5 whitespace-nowrap">

                @if (plantillaCelda) {
                  <ng-container *ngTemplateOutlet="plantillaCelda; context: { $implicit: item, columna: col }">
                  </ng-container>
                } @else {
                  <span class="font-medium text-sm text-slate-500 group-hover:text-slate-700 transition-colors">
                    {{ item[col.key] }}
                  </span>
                }

              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<div class="relative w-full group">
  <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none">
    <span class="text-slate-400 group-focus-within:text-blue-500 transition-colors text-lg">🔍</span>
  </div>

  <input #searchInput type="text" [value]="value()" [placeholder]="placeholder()" (input)="handleInput($event)"
    class="w-full pl-12 pr-12 py-5 bg-white border border-slate-100 rounded-3xl text-sm font-medium text-slate-600 placeholder:text-slate-300 focus:outline-none focus:ring-4 focus:ring-blue-50/50 focus:border-blue-200 transition-all shadow-sm hover:shadow-md" />

  @if (value()) {
  <button (click)="clearInput()"
    class="absolute inset-y-0 right-0 pr-5 flex items-center text-slate-300 hover:text-red-400 transition-colors"
    title="Limpiar búsqueda">
    <span class="text-sm">✕</span>
  </button>
  }
</div>

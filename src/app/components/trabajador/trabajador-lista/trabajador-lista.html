<div class="h-full overflow-auto bg-white rounded-2xl border border-slate-100 shadow-sm">

  <table mat-table [dataSource]="trabajadores()" class="w-full">

    <ng-container matColumnDef="Cedula">
      <th mat-header-cell *matHeaderCellDef class="text-slate-400 font-medium py-4"> Cédula </th>
      <td mat-cell *matCellDef="let t" class="text-slate-600 font-bold"> {{t.cedula}} </td>
    </ng-container>

    <ng-container matColumnDef="Nombres">
      <th mat-header-cell *matHeaderCellDef class="text-slate-400 font-medium"> Nombres </th>
      <td mat-cell *matCellDef="let t" class="text-slate-900"> {{t.nombres}} </td>
    </ng-container>

    <ng-container matColumnDef="Apellidos">
      <th mat-header-cell *matHeaderCellDef class="text-slate-400 font-medium"> Apellidos </th>
      <td mat-cell *matCellDef="let t" class="text-slate-900"> {{t.apellidos}} </td>
    </ng-container>

    <ng-container matColumnDef="IdCargo">
      <th mat-header-cell *matHeaderCellDef class="text-slate-400 font-medium"> Cargo </th>
      <td mat-cell *matCellDef="let t">
        <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-full text-xs font-semibold">
          {{t.idCargo}}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="bg-slate-50/50"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        (click)="seleccionar(row)"
        class="hover:bg-blue-50/30 cursor-pointer transition-colors border-transparent">
    </tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell p-8 text-center text-slate-400" colspan="4">
        No se encontraron trabajadores con ese criterio.
      </td>
    </tr>

  </table>
</div>

<div class="flex flex-col md:flex-row justify-between items-start
            md:items-center bg-white p-5 rounded-3xl border border-slate-200 shadow-sm gap-4">
  <div>
    <h2 class="text-xl font-black text-slate-800 tracking-tight">Gestión de Personal</h2>
    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Base de datos SST</p>
  </div>

  <div class="flex items-center gap-3 w-full md:w-auto">
    <div class="relative flex-1 md:w-64">
      <mat-icon class="absolute left-3 top-1 text-slate-400 scale-75">search</mat-icon>

      <input type="text" placeholder="Buscar por nombre o cédula..." (input)="handleSearch($event)"
        class="w-full bg-slate-50 border-none rounded-xl py-2 pl-10 pr-4 text-xs focus:ring-2 focus:ring-blue-500 transition-all outline-none">
    </div>

    <button (click)="abrirFormulario()" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl shadow-lg shadow-blue-100
              transition-all active:scale-95 flex items-center justify-center">
      <mat-icon>person_add</mat-icon>
    </button>
  </div>
</div>
